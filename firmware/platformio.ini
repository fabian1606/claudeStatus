; Claude Buddy firmware – ESP32-C3 Super Mini
; Build:  pio run          Flash:  pio run -t upload          Log:  pio device monitor

[env:claude-buddy]
platform = espressif32@6.13.0        ; Arduino-ESP32 core 2.0.17
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio         ; most C3 Super Mini clones need DIO
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.1
